# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
# Release binaries and container images are published by release.yml (GoReleaser).
name: Build, Test, and Coverage

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests with Coverage and SARIF
    runs-on: ubuntu-latest

    permissions:
      contents: read # checkout; upload-artifact needs no token scope

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history for SonarQube Cloud's blame and new-code detection.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form

      - name: Download dependencies
        shell: bash
        run: go mod download

      - name: Run tests with coverage
        shell: bash
        run: |
          go test -race -covermode=atomic -json -coverprofile=coverage.out ./... | tee test-results.json

      - name: Check coverage
        id: coverage
        if: always()
        shell: bash
        run: |
          if [[ ! -f coverage.out ]]; then
            echo "coverage.out is missing; tests likely failed before producing coverage"
            exit 1
          fi
          coverage="$(go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}')"
          echo "total_coverage=$coverage" >> "$GITHUB_ENV"
          echo "Coverage: $coverage%"

      # CI-based analysis, configured in sonar-project.properties; it imports
      # coverage.out, which automatic analysis cannot.
      - name: SonarQube Cloud scan
        # The pinned commit SHA after "sonarqube" matches the API-key pattern.
        # nosemgrep: generic.secrets.security.detected-sonarqube-docs-api-key.detected-sonarqube-docs-api-key
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: test-results.json

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f coverage.out test-results.json

      - name: Fail if coverage is below threshold
        if: always()
        shell: bash
        run: |
          if [[ -z "${total_coverage:-}" ]]; then
            echo "total_coverage is unset; previous step likely failed"
            exit 1
          fi
          awk -v cov="$total_coverage" 'BEGIN{ if (cov < 60) exit 1; else exit 0 }' || {
            echo "Coverage ($total_coverage%) is below the threshold (60%)"
            exit 1
          }

  build:
    name: Build Binaries
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read # checkout; upload-artifact needs no token scope

    strategy:
      matrix:
        goos:
          - linux
          - darwin
          - windows
        goarch:
          - amd64
          - arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form

      - name: Download dependencies
        run: go mod download

      - name: Build binary for ${{ matrix.goos }}-${{ matrix.goarch }}
        env:
          REF_NAME: ${{ github.ref_name }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.goos == 'windows' && '.exe' || '' }}
        run: |
          mkdir -p dist
          go build \
            -ldflags "-X main.version=${REF_NAME}" \
            -o "dist/gibidify-${GOOS}-${GOARCH}${EXT}" \
            .

      - name: Generate SHA256 checksum
        run: |
          cd dist
          for f in gibidify-*; do
            sha256sum "$f" > "$f.sha256"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gibidify-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
