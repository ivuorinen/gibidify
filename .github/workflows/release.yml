---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release with GoReleaser

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build, package, and publish release artifacts
    runs-on: ubuntu-latest

    permissions:
      contents: write # create the GitHub release and upload assets
      packages: write # push release container images to GHCR
      id-token: write # OIDC token for keyless signing / provenance

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Required for changelog generation
          persist-credentials: false

      - name: Setup Go
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # GoReleaser version from mise.toml, checksum from mise.lock. No cache:
      # a release run must not restore state another workflow could have saved.
      - name: Install GoReleaser
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: goreleaser
          cache: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        run: mise exec -- goreleaser release --clean
        env:
          # Only goreleaser was installed above; don't fetch the rest of mise.toml.
          MISE_EXEC_AUTO_INSTALL: "false"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: enable Homebrew tap publishing once the brews block in
          # .goreleaser.yaml is uncommented and the secret is configured.
          # HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Upload Release Assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: dist/
          retention-days: 7
