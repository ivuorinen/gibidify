---
name: Security Scan

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    # Run security scan weekly on Sundays at 00:00 UTC
    - cron: "0 0 * * 0"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security Analysis
    runs-on: ubuntu-latest

    permissions:
      security-events: write # upload gosec SARIF to code scanning
      contents: read
      actions: read # read workflow metadata for the analysis

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form

      # Tools come from mise.toml (versions) and mise.lock (checksums); the
      # Makefile targets below run them with `mise exec`. Go is set up first
      # because the go: backend tools (goimports, govulncheck) build with it.
      - name: Install tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      # The mandatory Go linters. MegaLinter (pr-lint.yml) disables GO_REVIVE
      # and has no staticcheck, so without these steps they only ran in local
      # hooks, which Renovate PRs and --no-verify commits never execute.
      - name: Run go vet and revive
        run: make lint-go

      - name: Run staticcheck
        run: make lint-static

      # Security Scanning with gosec
      - name: Run gosec Security Scanner
        run: make gosec-sarif

      - name: Upload gosec results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: gosec-results.sarif

      # Dependency Vulnerability Scanning
      # Parse SARIF output with jq, not the -json stream with grep:
      # govulncheck -json emits an `osv` advisory body for every known
      # vuln in any imported module regardless of reachability, so
      # grepping "osv" is a false positive. SARIF results in
      # runs[].results[] carry a `level` — "error" mirrors what the
      # govulncheck CLI counts as a failing (called/reachable) finding.
      # Ref: golang.org/x/vuln/internal/sarif.
      # govulncheck deliberately tracks latest; mise.toml records why.
      - name: Run govulncheck
        run: make vuln-sarif

      - name: Parse govulncheck results
        run: |
          if [ ! -s govulncheck-results.sarif ]; then
            echo "::error::govulncheck produced no SARIF output"
            exit 1
          fi

          called=$(jq '[.runs[].results[]? | select(.level == "error")] | length' govulncheck-results.sarif)
          informational=$(jq '[.runs[].results[]? | select(.level != "error")] | length' govulncheck-results.sarif)

          echo "Called (reachable) vulnerabilities: $called"
          echo "Informational findings (imported/required, not called): $informational"

          if [ "$called" -gt 0 ]; then
            echo "::error::Reachable vulnerabilities found in dependencies"
            jq -r '.runs[].results[]?
                   | select(.level == "error")
                   | "::error::\(.ruleId): \(.message.text)"' \
              govulncheck-results.sarif
            exit 1
          fi

      # Static analysis with opengrep registry rule packs
      - name: Run opengrep
        run: make lint-sast

      # GitHub Actions linting (actionlint + zizmor)
      - name: Lint workflows
        run: make lint-actions

      # Makefile Linting
      - name: Run checkmake on Makefile
        run: make lint-make

      # Shell Script Formatting Check
      - name: Check shell script formatting
        run: make lint-shell

      - name: Run YAML linting
        run: make lint-yamllint

      # Docker Security: misconfiguration scan of the Dockerfile. It gates: the
      # previous `docker run aquasec/trivy:latest … || true` pulled a mutable
      # image and passed whatever happened.
      - name: Run Docker security scan
        run: make lint-docker

      # Upload artifacts for review
      - name: Upload security scan results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-scan-results
          path: |
            gosec-results.sarif
            govulncheck-results.sarif
          retention-days: 30
