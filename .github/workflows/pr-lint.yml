---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: PR Lint

# yamllint disable-line rule:truthy
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  Linter:
    name: PR Lint
    runs-on: ubuntu-latest
    permissions:
      contents: write # allow the linter to push autofix commits if enabled
      issues: write # create/update issues from lint findings
      pull-requests: write # post lint results as PR comments
      statuses: write # set the PR lint commit status
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: ./.github/actions/setup
        with:
          token: ${{ github.token }}

      - uses: ivuorinen/actions/pr-lint@f7725f210c6740ae8042fbe89f2024dabad8a535 # v2026.07.11
