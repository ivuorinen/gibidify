---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "CodeQL"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "30 1 * * 0"
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read # read workflow run data for the actions analysis
      contents: read
      packages: read # read dependency packages during analysis
      security-events: write # upload CodeQL results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: ["actions", "go"]
    steps:
      - name: CodeQL Analysis
        uses: ivuorinen/actions/codeql-analysis@f7725f210c6740ae8042fbe89f2024dabad8a535 # v2026.07.11
        with:
          language: ${{ matrix.language }}
          queries: security-and-quality
