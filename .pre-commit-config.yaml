---
# yaml-language-server: $schema=https://json.schemastore.org/pre-commit-config.json
# Run with prek (`make lint`). Every hook is local and calls a tool through
# `mise exec` or a Makefile target, so mise.toml is the single source of tool
# versions: pins copied into this file drifted (staticcheck v0.7.0, gosec
# v2.24.0 while the Makefile had moved on) until every hook crashed on go1.27
# export data.
repos:
  - repo: local
    hooks:
      - id: editorconfig-checker
        name: editorconfig-checker
        alias: ec
        entry: mise exec -- editorconfig-checker
        language: system
        types:
          - text

      - id: github-actions
        name: actionlint + zizmor
        entry: make lint-actions
        language: system
        files: ^\.github/
        pass_filenames: false

      - id: markdownlint
        name: markdownlint
        entry: make lint-md
        language: system
        types:
          - markdown
        pass_filenames: false

      - id: yamlfmt
        name: yamlfmt
        entry: make lint-yaml
        language: system
        types:
          - yaml
        pass_filenames: false

      - id: yamllint
        name: yamllint
        entry: make lint-yamllint
        language: system
        types:
          - yaml
        pass_filenames: false

      - id: go-build
        name: go build
        entry: go build ./...
        language: system
        types:
          - go
        pass_filenames: false

      - id: go-mod-tidy
        name: go mod tidy
        entry: go mod tidy
        language: system
        files: ^go\.(mod|sum)$
        pass_filenames: false

      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        types:
          - go
        pass_filenames: false

      - id: go-fmt
        name: gofmt
        entry: bash -c 'test -z "$(gofmt -l "$@")"' --
        language: system
        types:
          - go

      - id: revive
        name: revive
        entry: make lint-go
        language: system
        types:
          - go
        pass_filenames: false

      - id: staticcheck
        name: staticcheck
        entry: make lint-static
        language: system
        types:
          - go
        pass_filenames: false

      - id: gosec
        name: gosec
        entry: make lint-sec
        language: system
        types:
          - go
        pass_filenames: false

      # govulncheck intentionally tracks latest (see mise.toml): the vuln DB is
      # fetched live from vuln.go.dev each run; the binary controls reachability
      # analysis. Gated on go.mod/go.sum only — running it on every Go file edit
      # adds network latency to every commit, and the realistic vector for new
      # findings is dependency changes. CI re-runs it on every PR regardless.
      - id: govulncheck
        name: govulncheck
        entry: make vuln-check
        language: system
        files: ^go\.(mod|sum)$
        pass_filenames: false
