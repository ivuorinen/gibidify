# SonarQube Cloud CI-based analysis, run by the test job in
# .github/workflows/build-test-publish.yml after `go test` writes coverage.out.
# Automatic analysis cannot import coverage and ignores this file.
sonar.organization=ivuorinen
sonar.projectKey=ivuorinen_gibidify

sonar.sources=.
# .mise holds mise's generated dependency locks (see mise.lock).
sonar.exclusions=**/*_test.go,.mise/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go

sonar.go.coverage.reportPaths=coverage.out
